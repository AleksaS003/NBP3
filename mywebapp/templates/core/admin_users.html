{% extends 'base.html' %}

{% block title %}{{ title }} - Admin{% endblock %}

{% block content %}
<article>
    <header>
        <hgroup>
            <h1>User Management</h1>
            <h2>Administrative User Overview</h2>
        </hgroup>
    </header>
    
    <nav>
        <ul>
            <li>
                <a href="{% url 'admin_dashboard' %}" role="button" class="secondary">
                    Back to Admin Dashboard
                </a>
            </li>
        </ul>
    </nav>
    
    <section>
        <h2>All Users</h2>
        {% if users %}
            <figure>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Admin</th>
                            <th>Staff</th>
                            <th>Active</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                            <tr>
                                <td>{{ user.id }}</td>
                                <td>{{ user.username }}</td>
                                <td>{{ user.email }}</td>
                                <td>{{ user.is_admin|yesno:"Yes,No" }}</td>
                                <td>{{ user.is_staff|yesno:"Yes,No" }}</td>
                                <td>{{ user.is_active|yesno:"Yes,No" }}</td>
                                <td>{{ user.date_joined|date:"Y-m-d" }}</td>
                                <td>
                                    <a href="{% url 'admin_user_detail' user.id %}">
                                        View
                                    </a>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </figure>
        {% else %}
            <p>No users found.</p>
        {% endif %}
    </section>
</article>
{% endblock %}
