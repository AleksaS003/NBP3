{% extends 'base.html' %}
{% block title %}Manage Products - Admin{% endblock %}

{% block content %}
<article>
    <header>
        <hgroup>
            <h1>Manage Products</h1>
            <h2>All products in the store</h2>
        </hgroup>

        <div class="grid">
            <a href="{% url 'admin_add_product' %}" role="button">Add New Product</a>
            <a href="{% url 'admin_dashboard' %}" role="button" class="secondary">Back to Dashboard</a>
        </div>
    </header>

    {% if products %}
    <figure>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th style="width: 180px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for p in products %}
                <tr>
                    <td>{{ p.name }}</td>
                    <td>{{ p.category }}</td>
                    <td>{{ p.price }}</td>
                    <td>{{ p.stock }}</td>
                    <td>
                        <div style="display:flex; gap:.5rem;">
                            <a href="{% url 'admin_edit_product' p.id %}" role="button" class="secondary fix-height2">
                                Edit
                            </a>

                            <form method="post" action="{% url 'admin_delete_product' p.id %}" style="margin:0;"
                                onsubmit="return confirm('Are you sure you want to delete this product?');">
                                {% csrf_token %}
                                <button type="submit" class="outline contrast">
                                    Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </figure>
    {% else %}
    <p>No products found.</p>
    {% endif %}
</article>
{% endblock %}
