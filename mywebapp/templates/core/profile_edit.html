{% extends 'base.html' %}

{% block title %}{{ title }} - Shongo{% endblock %}

{% block content %}
<article>
    <header>
        <hgroup>
            <h1>Edit Profile</h1>
            <h2>Update your account information</h2>
        </hgroup>
    </header>
    
    <section>
        <form method="post">
            {% csrf_token %}
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ user.email }}">
            
            <label for="phone_number">Phone Number:</label>
            <input type="text" id="phone_number" name="phone_number" value="{{ user.phone_number }}">
            
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="3">{{ user.address }}</textarea>
            
            <div class="grid">
                <button type="submit">Save Changes</button>
                <a href="{% url 'profile' %}" role="button" class="secondary fix-height2">Cancel</a>
            </div>
        </form>
    </section>
</article>
{% endblock %}
